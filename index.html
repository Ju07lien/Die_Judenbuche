<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interaktiver Zeitstrahl – Die Judenbuche</title>
  <style>
    :root{
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent2:#0ea5e9;
      --danger:#dc2626;
      --shadow: 0 10px 25px rgba(17,24,39,.08);
      --radius: 18px;
    }

    *{ box-sizing:border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif; }
    body{
      margin:0;
      background: radial-gradient(1200px 400px at 15% 0%, rgba(37,99,235,.14), transparent 60%),
                  radial-gradient(900px 350px at 90% 10%, rgba(14,165,233,.12), transparent 60%),
                  var(--bg);
      color:var(--text);
      padding: 18px;
    }

    .container{ max-width: 1100px; margin: 0 auto; }

    header{
      background: linear-gradient(135deg, rgba(37,99,235,.10), rgba(14,165,233,.10));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    h1{ margin:0; font-size: 1.35rem; letter-spacing: .2px; }
    .subtitle{ margin:6px 0 0; color: var(--muted); font-size:.95rem; line-height:1.35; }

    .topbar{
      margin-top: 12px;
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .pillrow{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .chip{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.75);
      color: var(--text);
      font-size: .85rem;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
    }
    .chip strong{ font-weight: 700; }
    .dot{
      width:10px;height:10px;border-radius:999px;background:var(--accent);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
    }

    .layout{
      display:grid;
      grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
      gap: 14px;
      align-items:start;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .card-header{
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,1));
    }

    .card-title{
      margin:0;
      font-size: .95rem;
      color: #111827;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .card-title .icon{
      width: 28px; height: 28px; border-radius: 10px;
      background: rgba(37,99,235,.10);
      border: 1px solid rgba(37,99,235,.18);
      display:grid; place-items:center;
      color: var(--accent);
      font-weight: 800;
      font-size: .9rem;
    }

    .card-body{ padding: 12px 14px; }

    /* Timeline list */
    .timeline-tools{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .search{
      display:flex; gap: 10px; align-items:center;
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px;
      background: rgba(255,255,255,.85);
    }
    .search input{
      width:100%;
      border:none;
      outline:none;
      background: transparent;
      font-size: .9rem;
      color: var(--text);
    }
    .search .mag{
      width: 28px; height: 28px; border-radius: 10px;
      display:grid; place-items:center;
      background: rgba(14,165,233,.10);
      border:1px solid rgba(14,165,233,.18);
      color: var(--accent2);
      font-weight: 800;
    }

    .toggle{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items:center;
      justify-content:flex-start;
    }

    .seg{
      display:inline-flex;
      border:1px solid var(--border);
      background: rgba(255,255,255,.85);
      border-radius: 999px;
      overflow:hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,.02);
    }
    .seg button{
      border:none;
      padding: 8px 12px;
      cursor:pointer;
      background: transparent;
      font-size: .84rem;
      color: var(--muted);
      white-space:nowrap;
    }
    .seg button.active{
      background: rgba(37,99,235,.12);
      color: var(--accent);
      font-weight: 700;
    }

    .timeline-list{
      max-height: 74vh;
      overflow:auto;
      padding: 8px 8px 10px;
    }

    .timeline-item{
      width: 100%;
      text-align:left;
      border:none;
      cursor:pointer;
      background: transparent;
      padding: 10px 10px 10px 12px;
      border-radius: 14px;
      position: relative;
      transition: transform .06s ease, background .12s ease;
      display:flex;
      gap: 10px;
      align-items:flex-start;
    }

    .timeline-item:hover{ background: rgba(17,24,39,.04); }
    .timeline-item:active{ transform: scale(.99); }

    .marker{
      width: 12px;
      height: 12px;
      border-radius: 999px;
      margin-top: 4px;
      background: #9ca3af;
      flex: 0 0 auto;
      box-shadow: 0 0 0 5px rgba(156,163,175,.14);
    }

    .timeline-item.active{
      background: rgba(37,99,235,.10);
    }
    .timeline-item.active .marker{
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(37,99,235,.18);
    }

    .ttext{ min-width:0; }
    .timeline-label{
      margin:0;
      font-size: .92rem;
      font-weight: 750;
      line-height:1.15;
    }
    .timeline-time{
      margin-top: 3px;
      font-size: .78rem;
      color: var(--muted);
      display:flex; gap:8px; flex-wrap:wrap;
    }
    .badge{
      font-size:.74rem;
